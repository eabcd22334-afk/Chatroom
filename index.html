<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sagor's Chatroom</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:#f5f0e6;
    min-height:100vh;
}

.screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:#211d18;
    border:1px solid #4d4338;
    border-radius:22px;
    padding:30px;
    box-shadow:0 20px 60px #000;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.sub{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid #554b40;
    background:#15130f;
    color:white;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#e8dfcf;
    color:#17130f;
    font-weight:bold;
    cursor:pointer;
    margin-top:7px;
}

button:hover{
    opacity:.9;
}

.secondary{
    background:#332d26;
    color:#eee;
}

.error{
    color:#ff7777;
    text-align:center;
    margin-top:10px;
}

#chatScreen{
    display:none;
    height:100vh;
    flex-direction:column;
}

.header{
    padding:15px 20px;
    background:#211d18;
    border-bottom:1px solid #40372e;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header small{
    color:#aaa;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    max-width:75%;
    background:#29231d;
    border:1px solid #40372e;
    padding:12px;
    border-radius:15px;
    margin-bottom:12px;
}

.mine{
    margin-left:auto;
    background:#3b332a;
}

.name{
    font-size:12px;
    color:#cfc2ae;
    margin-bottom:5px;
}

.time{
    font-size:10px;
    color:#888;
    margin-top:6px;
}

.actions{
    display:flex;
    gap:5px;
    margin-top:7px;
}

.actions button{
    width:auto;
    padding:6px 9px;
    font-size:11px;
    margin:0;
}

.composer{
    padding:12px;
    background:#211d18;
    border-top:1px solid #40372e;
    display:flex;
    gap:8px;
}

.composer input{
    margin:0;
}

.send{
    width:80px;
    margin:0;
}

.admin{
    color:#e8dfcf;
    font-size:11px;
    margin-left:5px;
}

.pin{
    background:#2d281f;
    border:1px solid #665744;
    padding:12px;
    margin:10px 20px;
    border-radius:12px;
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>

<!-- ROOM PIN -->
<div id="pinScreen" class="screen">
    <div class="card">
        <h1>Sagor's Chatroom</h1>
        <div class="sub">Enter Room PIN</div>

        <input id="roomPin" type="password" placeholder="Room PIN">
        <button onclick="checkRoomPin()">Enter Room</button>

        <div id="pinError" class="error"></div>
    </div>
</div>


<!-- NAME -->
<div id="nameScreen" class="screen hidden">
    <div class="card">
        <h1>Welcome</h1>
        <div class="sub">Choose your display name</div>

        <input id="displayName" placeholder="Your name">

        <button onclick="enterChat()">Enter Chat</button>

        <button class="secondary" onclick="showMasterLogin()">
             Master Login
        </button>

        <div id="nameError" class="error"></div>
    </div>
</div>


<!-- MASTER LOGIN -->
<div id="masterScreen" class="screen hidden">
    <div class="card">
        <h1> Master Login</h1>

        <div class="sub">
            Admin access
        </div>

        <input
            id="masterEmail"
            type="email"
            value="admin@sagorchat.com"
            placeholder="Admin email">

        <input
            id="masterPassword"
            type="password"
            placeholder="Master Password">

        <button onclick="masterLogin()">
            Login as Master
        </button>

        <button class="secondary" onclick="backToName()">
            Back
        </button>

        <div id="masterError" class="error"></div>
    </div>
</div>


<!-- CHAT -->
<div id="chatScreen">

    <div class="header">
        <div>
            <b>Sagor's Chatroom</b><br>
            <small id="userInfo"></small>
        </div>

        <button
            id="adminButton"
            class="hidden"
            onclick="adminPanel()"
            style="width:auto;margin:0;">
            Admin
        </button>
    </div>

    <div id="pinnedBox"></div>

    <div id="messages" class="chat"></div>

    <div class="composer">
        <input
            id="messageInput"
            placeholder="Write a message..."
            onkeydown="if(event.key==='Enter')sendMessage()">

        <button class="send" onclick="sendMessage()">
            Send
        </button>
    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    get,
    remove,
    onValue
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

import {
    getAuth,
    signInAnonymously,
    signInWithEmailAndPassword,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC8aJLxFDydGqDkaF3RPGdSXr6RLGXd0Bs",

    authDomain:
    "assanger-51e65.firebaseapp.com",

    databaseURL:
    "https://assanger-51e65-default-rtdb.firebaseio.com",

    projectId:
    "assanger-51e65",

    storageBucket:
    "assanger-51e65.firebasestorage.app",

    messagingSenderId:
    "887503433353",

    appId:
    "1:887503433353:web:8255955b0d958ea88e2058",

    measurementId:
    "G-5J5CC8HKNZ"
};


/* =========================
   ADMIN CONFIG
========================= */

const ADMIN_EMAIL = "admin@sagorchat.com";


/* =========================
   FIREBASE START
========================= */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentName = "";
let isAdmin = false;


/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, user => {

    currentUser = user;

});


/* =========================
   START ANONYMOUS USER
========================= */

async function anonymousLogin(){

    try{

        if(!auth.currentUser){

            await signInAnonymously(auth);

        }

    }catch(error){

        console.error(error);

    }

}


/* =========================
   ROOM PIN
========================= */

window.checkRoomPin = async function(){

    const entered =
        document.getElementById("roomPin").value.trim();

    const error =
        document.getElementById("pinError");

    error.textContent = "";


    if(!entered){

        error.textContent =
            "Enter the Room PIN.";

        return;
    }


    try{

        await anonymousLogin();

        const pinSnapshot =
            await get(ref(db,"settings/pin"));

        const realPin =
            pinSnapshot.exists()
            ? pinSnapshot.val()
            : "1000";


        if(entered === String(realPin)){

            document
                .getElementById("pinScreen")
                .classList.add("hidden");

            document
                .getElementById("nameScreen")
                .classList.remove("hidden");

        }else{

            error.textContent =
                "Wrong Room PIN.";

        }

    }catch(error){

        console.error(error);

        /*
         Default PIN
         */

        if(entered === "1000"){

            document
                .getElementById("pinScreen")
                .classList.add("hidden");

            document
                .getElementById("nameScreen")
                .classList.remove("hidden");

        }else{

            document.getElementById("pinError")
                .textContent =
                "Unable to verify PIN.";

        }

    }

};


/* =========================
   NAME
========================= */

window.enterChat = async function(){

    const name =
        document
        .getElementById("displayName")
        .value.trim();

    if(!name){

        document
            .getElementById("nameError")
            .textContent =
            "Enter your name.";

        return;

    }


    await anonymousLogin();

    currentName = name;

    isAdmin = false;

    openChat();

};


/* =========================
   MASTER LOGIN SCREEN
========================= */

window.showMasterLogin = function(){

    document
        .getElementById("nameScreen")
        .classList.add("hidden");

    document
        .getElementById("masterScreen")
        .classList.remove("hidden");

};


window.backToName = function(){

    document
        .getElementById("masterScreen")
        .classList.add("hidden");

    document
        .getElementById("nameScreen")
        .classList.remove("hidden");

};


/* =========================
   MASTER LOGIN
========================= */

window.masterLogin = async function(){

    const email =
        document
        .getElementById("masterEmail")
        .value.trim();

    const password =
        document
        .getElementById("masterPassword")
        .value;

    const error =
        document
        .getElementById("masterError");

    error.textContent = "";


    if(!email || !password){

        error.textContent =
            "Enter email and password.";

        return;

    }


    try{

        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        currentUser =
            credential.user;

        isAdmin =
            email.toLowerCase() ===
            ADMIN_EMAIL.toLowerCase();


        if(!isAdmin){

            error.textContent =
                "This account is not an admin.";

            return;

        }


        currentName = "Master";

        openChat();


    }catch(err){

        console.error(err);

        error.textContent =
            "Invalid Master email or password.";

    }

};


/* =========================
   OPEN CHAT
========================= */

function openChat(){

    document
        .getElementById("nameScreen")
        .classList.add("hidden");

    document
        .getElementById("masterScreen")
        .classList.add("hidden");

    document
        .getElementById("chatScreen")
        .style.display = "flex";


    document
        .getElementById("userInfo")
        .textContent =
        currentName +
        (isAdmin ? " • MASTER" : "");


    if(isAdmin){

        document
            .getElementById("adminButton")
            .classList.remove("hidden");

    }


    loadMessages();

}


/* =========================
   SEND MESSAGE
========================= */

window.sendMessage = async function(){

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text) return;

    if(!currentUser){

        alert("Authentication not ready.");

        return;

    }


    try{

        const messageRef =
            push(ref(db,"messages"));

        await set(messageRef,{

            uid:
                currentUser.uid,

            sender:
                currentName,

            text:
                text,

            timestamp:
                Date.now()

        });


        input.value = "";


    }catch(error){

        console.error(error);

        alert(
            "Message could not be sent."
        );

    }

};


/* =========================
   LOAD MESSAGES
========================= */

function loadMessages(){

    const messagesRef =
        ref(db,"messages");


    onValue(messagesRef, snapshot => {

        const container =
            document.getElementById("messages");

        container.innerHTML = "";


        const data =
            snapshot.val();


        if(!data) return;


        Object.entries(data)
        .sort((a,b)=>
            (a[1].timestamp || 0) -
            (b[1].timestamp || 0)
        )
        .forEach(([id,message])=>{

            createMessage(
                id,
                message
            );

        });


        container.scrollTop =
            container.scrollHeight;

    });

}


/* =========================
   CREATE MESSAGE
========================= */

function createMessage(id,message){

    const container =
        document.getElementById("messages");


    const box =
        document.createElement("div");


    box.className =
        "message";


    if(
        currentUser &&
        message.uid === currentUser.uid
    ){

        box.classList.add("mine");

    }


    const name =
        document.createElement("div");

    name.className =
        "name";

    name.textContent =
        message.sender || "Unknown";


    if(message.uid === currentUser?.uid &&
       isAdmin){

        const badge =
            document.createElement("span");

        badge.className =
            "admin";

        badge.textContent =
            "👑 MASTER";

        name.appendChild(badge);

    }


    const text =
        document.createElement("div");

    text.textContent =
        message.text || "";


    const time =
        document.createElement("div");

    time.className =
        "time";

    time.textContent =
        new Date(
            message.timestamp || Date.now()
        ).toLocaleString();


    box.appendChild(name);

    box.appendChild(text);

    box.appendChild(time);


    if(isAdmin){

        const actions =
            document.createElement("div");

        actions.className =
            "actions";


        const deleteBtn =
            document.createElement("button");

        deleteBtn.textContent =
            "🗑 Delete";

        deleteBtn.onclick =
            () => deleteMessage(id);


        const pinBtn =
            document.createElement("button");

        pinBtn.textContent =
            "📌 Pin";

        pinBtn.onclick =
            () => pinMessage(
                id,
                message
            );


        actions.appendChild(deleteBtn);

        actions.appendChild(pinBtn);

        box.appendChild(actions);

    }


    container.appendChild(box);

}


/* =========================
   DELETE MESSAGE
========================= */

async function deleteMessage(id){

    if(!isAdmin) return;


    if(!confirm(
        "Delete this message?"
    )) return;


    try{

        await remove(
            ref(db,"messages/" + id)
        );

    }catch(error){

        console.error(error);

        alert(
            "Delete failed."
        );

    }

}


/* =========================
   PIN MESSAGE
========================= */

async function pinMessage(id,message){

    if(!isAdmin) return;


    try{

        await set(
            ref(db,"settings/pinnedMessage"),
            {
                id:id,
                sender:message.sender,
                text:message.text,
                timestamp:message.timestamp
            }
        );


        alert("Message pinned.");

    }catch(error){

        console.error(error);

        alert("Pin failed.");

    }

}


/* =========================
   LOAD PINNED
========================= */

onValue(
    ref(db,"settings/pinnedMessage"),
    snapshot => {

        const box =
            document.getElementById(
                "pinnedBox"
            );

        box.innerHTML = "";


        if(!snapshot.exists())
            return;


        const message =
            snapshot.val();


        const div =
            document.createElement("div");

        div.className =
            "pin";


        div.innerHTML =
            "<b>📌 Pinned Message</b><br>";


        const text =
            document.createElement("span");

        text.textContent =
            message.text || "";


        div.appendChild(text);


        if(isAdmin){

            const unpin =
                document.createElement("button");

            unpin.textContent =
                "Unpin";

            unpin.style.width =
                "auto";

            unpin.onclick =
                async () => {

                    await remove(
                        ref(
                            db,
                            "settings/pinnedMessage"
                        )
                    );

                };


            div.appendChild(unpin);

        }


        box.appendChild(div);

    }
);


/* =========================
   ADMIN PANEL
========================= */

window.adminPanel = function(){

    if(!isAdmin) return;


    const action =
        prompt(
            "ADMIN PANEL\n\n" +
            "1 = Change Room PIN\n" +
            "2 = Clear all messages"
        );


    if(action === "1"){

        changeRoomPin();

    }


    if(action === "2"){

        clearMessages();

    }

};


/* =========================
   CHANGE ROOM PIN
========================= */

async function changeRoomPin(){

    const newPin =
        prompt(
            "Enter new Room PIN:"
        );


    if(!newPin) return;


    try{

        await set(
            ref(db,"settings/pin"),
            newPin
        );


        alert(
            "Room PIN changed successfully."
        );

    }catch(error){

        console.error(error);

        alert(
            "Could not change PIN."
        );

    }

}


/* =========================
   CLEAR MESSAGES
========================= */

async function clearMessages(){

    if(!isAdmin) return;


    if(!confirm(
        "Delete ALL messages?"
    )) return;


    try{

        await remove(
            ref(db,"messages")
        );


        alert(
            "All messages deleted."
        );

    }catch(error){

        console.error(error);

        alert(
            "Failed to clear messages."
        );

    }

}

</script>

</body>
</html>
